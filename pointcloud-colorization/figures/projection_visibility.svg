<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700">
<title>体素层次结构与跨块可见性判定</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#60758A"/></marker></defs>
<rect width="1240" height="700" fill="white"/>
<text x="620" y="42" text-anchor="middle" font-family="DejaVu Sans" font-size="27" font-weight="bold" fill="#243447">Cross-Block Voxel Visibility</text>
<rect x="430" y="105" width="500" height="450" fill="#F8FAFC" stroke="#2F5D8C" stroke-width="3"/>
<text x="680" y="590" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#2F5D8C">Target Block</text>
<rect x="930" y="105" width="210" height="450" fill="#FFF8F2" stroke="#D98941" stroke-width="2.5" stroke-dasharray="8,6"/>
<text x="1035" y="590" text-anchor="middle" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#D98941">Neighbor Block</text>
<circle cx="135" cy="370" r="17" fill="#D98941"/>
<text x="135" y="410" text-anchor="middle" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#243447">Camera</text>
<circle cx="805" cy="245" r="14" fill="#4E8A67"/>
<text x="805" y="220" text-anchor="middle" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#243447">Target Voxel</text>
<rect x="600" y="275" width="44" height="44" fill="#B64B4B" opacity="0.78"/>
<text x="622" y="345" text-anchor="middle" font-family="DejaVu Sans" font-size="15" font-weight="normal" fill="#243447">Block Occluder</text>
<rect x="980" y="430" width="44" height="44" fill="#B64B4B" opacity="0.78"/>
<text x="1002" y="505" text-anchor="middle" font-family="DejaVu Sans" font-size="15" font-weight="normal" fill="#243447">Neighbor Occluder</text>
<line x1="152" y1="365" x2="805" y2="245" stroke="#4E8A67" stroke-width="3"/>
<line x1="152" y1="375" x2="1080" y2="460" stroke="#3A86A8" stroke-width="2.5" stroke-dasharray="8,6"/>
<rect x="485" y="175" width="34" height="34" fill="#DCE8F2" stroke="#2F5D8C"/>
<rect x="550" y="420" width="34" height="34" fill="#DCE8F2" stroke="#2F5D8C"/>
<rect x="735" y="330" width="34" height="34" fill="#DCE8F2" stroke="#2F5D8C"/>
<rect x="860" y="470" width="34" height="34" fill="#DCE8F2" stroke="#2F5D8C"/>
<rect x="1080" y="180" width="34" height="34" fill="#DCE8F2" stroke="#2F5D8C"/>
<text x="620" y="630" text-anchor="middle" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#243447">Rays are tested against the target block and selected neighboring blocks.</text>
<text x="620" y="662" text-anchor="middle" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#243447">Only visible Top-K views are passed to point-level projection checks.</text>
</svg>

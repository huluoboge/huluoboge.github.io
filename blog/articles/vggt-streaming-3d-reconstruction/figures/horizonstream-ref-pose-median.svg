<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc">
  <title id="title">HorizonStream 的动态 Reference、窗口位姿推理与在线中位数融合</title>
  <desc id="desc">窗口滑动时，上一窗口的 Reference 变为 Source，新到帧成为 Reference。历史 Patch K/V 继续复用，窗口 Pose Tokens 重新构造并联合推理，输出重叠相对位姿。在线 Motion Averaging 将历史全局位姿与新预测组合成当前帧候选，再以中位旋转和逐坐标位置中位数追加当前位姿。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker>
    <marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d97706"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#059669"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#172033}.title{font-size:38px;font-weight:700}.sub{font-size:22px;fill:#526176}.head{font-size:26px;font-weight:700}.label{font-size:22px;font-weight:650}.body{font-size:20px}.small{font-size:18px;fill:#526176}.panel{fill:#fff;stroke:#d7e0ea;stroke-width:2}.bluebox{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.orangebox{fill:#fff7ed;stroke:#fb923c;stroke-width:2}.greenbox{fill:#ecfdf5;stroke:#34d399;stroke-width:2}.gray{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.line{fill:none;stroke:#475569;stroke-width:2.7;marker-end:url(#arrow)}.bline{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#blue)}.oline{fill:none;stroke:#d97706;stroke-width:3;marker-end:url(#orange)}.gline{fill:none;stroke:#059669;stroke-width:3;marker-end:url(#green)}.dash{stroke-dasharray:8 7}
    </style>
  </defs>
  <rect width="1200" height="1060" fill="#f5f8fc"/>
  <text x="38" y="56" class="title">HorizonStream：Reference 轮换后，怎样更新在线轨迹</text>
  <text x="40" y="91" class="sub">短期 Patch 缓存、窗口 Pose 推理和全局轨迹融合，采用了不同的更新路径。</text>

  <rect x="32" y="120" width="1136" height="250" rx="20" class="panel"/>
  <text x="58" y="160" class="head">① 窗口滑动：上一帧 ref 变为 src</text>
  <text x="68" y="203" class="body">窗口 k</text>
  <rect x="190" y="177" width="210" height="68" rx="13" class="gray"/><text x="295" y="207" text-anchor="middle" class="label">帧 k−2 · src</text><text x="295" y="232" text-anchor="middle" class="small">历史帧</text>
  <rect x="420" y="177" width="210" height="68" rx="13" class="gray"/><text x="525" y="207" text-anchor="middle" class="label">帧 k−1 · src</text><text x="525" y="232" text-anchor="middle" class="small">历史帧</text>
  <rect x="650" y="177" width="210" height="68" rx="13" class="orangebox"/><text x="755" y="207" text-anchor="middle" class="label">帧 k · ref</text><text x="755" y="232" text-anchor="middle" class="small">当前输出帧</text>
  <text x="68" y="300" class="body">窗口 k+1</text>
  <rect x="190" y="272" width="210" height="68" rx="13" class="gray"/><text x="295" y="302" text-anchor="middle" class="label">帧 k−1 · src</text><text x="295" y="327" text-anchor="middle" class="small">历史帧</text>
  <rect x="420" y="272" width="210" height="68" rx="13" fill="#fff7ed" stroke="#fb923c" stroke-width="2.5"/><text x="525" y="302" text-anchor="middle" class="label">帧 k · src</text><text x="525" y="327" text-anchor="middle" class="small">角色由 ref 切为 src</text>
  <rect x="650" y="272" width="210" height="68" rx="13" class="orangebox"/><text x="755" y="302" text-anchor="middle" class="label">帧 k+1 · ref</text><text x="755" y="327" text-anchor="middle" class="small">新当前输出帧</text>
  <path d="M755 245 V265" class="oline"/><text x="895" y="215" class="small">ref 是当前窗口中的</text><text x="895" y="240" class="small">位姿角色，不是全局原点。</text>
  <text x="895" y="300" class="small">每个新窗口重新构造</text><text x="895" y="325" class="small">窗口内 Pose Tokens。</text>

  <rect x="32" y="395" width="1136" height="270" rx="20" class="panel"/>
  <text x="58" y="435" class="head">② 混合更新：历史 Patch K/V 复用，窗口 Pose Tokens 联合推理</text>
  <rect x="65" y="475" width="302" height="74" rx="14" class="bluebox"/><text x="216" y="507" text-anchor="middle" class="label">历史 Patch K/V</text><text x="216" y="534" text-anchor="middle" class="small">从缓存读取，继续复用</text>
  <rect x="65" y="568" width="302" height="64" rx="14" class="gray"/><text x="216" y="596" text-anchor="middle" class="label">新帧 Patch K/V</text><text x="216" y="620" text-anchor="middle" class="small">为当前帧计算并追加</text>
  <rect x="430" y="475" width="318" height="157" rx="15" class="orangebox"/><text x="589" y="510" text-anchor="middle" class="label">当前窗口 Pose Tokens</text>
  <circle cx="500" cy="558" r="27" fill="#fed7aa" stroke="#fb923c" stroke-width="2"/><text x="500" y="566" text-anchor="middle" class="small">src</text>
  <circle cx="589" cy="558" r="27" fill="#fed7aa" stroke="#fb923c" stroke-width="2"/><text x="589" y="566" text-anchor="middle" class="small">src</text>
  <circle cx="678" cy="558" r="27" fill="#fdba74" stroke="#ea580c" stroke-width="2"/><text x="678" y="566" text-anchor="middle" class="small">ref</text>
  <path d="M523 550 H566" class="oline"/><path d="M566 569 H523" class="oline"/><path d="M612 550 H655" class="oline"/><path d="M655 569 H612" class="oline"/>
  <text x="589" y="613" text-anchor="middle" class="small">窗口内 Pose Token 彼此可见、双向交互</text>
  <rect x="820" y="495" width="285" height="118" rx="15" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="962" y="535" text-anchor="middle" class="label">Global Attention</text><text x="962" y="568" text-anchor="middle" class="small">Patch 与 Pose 一起参与</text><text x="962" y="593" text-anchor="middle" class="small">当前可见窗口的推理</text>
  <path d="M367 510 H418" class="bline"/><path d="M367 599 H418" class="bline"/><path d="M748 553 H812" class="oline"/>
  <text x="65" y="650" class="small">因此：输出仍不读取未来帧，但窗口内并非所有 Token 都按逐帧单向方式更新。</text>

  <rect x="32" y="690" width="1136" height="330" rx="20" class="panel"/>
  <text x="58" y="730" class="head">③ 重叠相对位姿 → 在线 Motion Averaging → 只追加当前帧</text>
  <rect x="65" y="770" width="295" height="86" rx="14" class="orangebox"/><text x="212" y="805" text-anchor="middle" class="label">窗口 Pose 推理</text><text x="212" y="834" text-anchor="middle" class="small">重算各历史帧相对当前 ref 的位姿</text>
  <rect x="65" y="879" width="295" height="78" rx="14" class="gray"/><text x="212" y="911" text-anchor="middle" class="label">已存历史全局位姿</text><text x="212" y="938" text-anchor="middle" class="small">作为候选生成的依据</text>
  <rect x="435" y="812" width="300" height="116" rx="15" class="greenbox"/><text x="585" y="850" text-anchor="middle" class="label">构造当前帧位姿候选</text><text x="585" y="882" text-anchor="middle" class="small">来自多个重叠相对关系</text><text x="585" y="910" text-anchor="middle" class="small">旋转中位数 + 位置逐坐标中位数</text>
  <rect x="820" y="812" width="285" height="116" rx="15" class="greenbox"/><text x="962" y="850" text-anchor="middle" class="label">追加帧 k+1 位姿</text><text x="962" y="882" text-anchor="middle" class="small">在线步骤不回改旧全局位姿</text><text x="962" y="910" text-anchor="middle" class="small">回环后端可另行优化轨迹</text>
  <path d="M360 813 H425" class="oline"/><path d="M360 918 H400 V900 H425" class="line"/><path d="M735 870 H812" class="gline"/>
  <path d="M118 978 H1020" fill="none" stroke="#94a3b8" stroke-width="3"/><circle cx="190" cy="978" r="9" fill="#64748b"/><circle cx="370" cy="978" r="9" fill="#64748b"/><circle cx="550" cy="978" r="9" fill="#64748b"/><circle cx="730" cy="978" r="9" fill="#64748b"/><circle cx="910" cy="978" r="12" fill="#059669"/><text x="1028" y="985" class="small">轨迹向前扩展</text>
</svg>

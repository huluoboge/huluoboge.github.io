<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">WinT3R 的局部点图与相对位姿监督</title>
  <desc id="desc">两帧分别预测相机局部坐标系下的点图。每帧的 Camera Token 和历史 Token Pool 进入 Camera Head，得到一组位姿；训练时比较所有帧对的相对位姿，不将首帧指定为固定参考。点图损失与相机相对位姿损失分别监督。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d97706"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#059669"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .title { font-size: 36px; font-weight: 700; }
      .subtitle { font-size: 20px; fill: #526176; }
      .heading { font-size: 25px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 650; }
      .body { font-size: 18px; }
      .small { font-size: 16px; fill: #526176; }
      .panel { fill: #fff; stroke: #d7e0ea; stroke-width: 2; }
      .blue { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
      .orange { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; }
      .green { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; }
      .gray { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .blue-line { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow-blue); }
      .orange-line { fill: none; stroke: #d97706; stroke-width: 3; marker-end: url(#arrow-orange); }
      .green-line { fill: none; stroke: #059669; stroke-width: 3; marker-end: url(#arrow-green); }
      .gray-line { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow-gray); }
      .dash { stroke-dasharray: 8 7; }
    </style>
  </defs>
  <rect width="1440" height="860" fill="#f5f8fc"/>
  <text x="48" y="62" class="title">WinT3R：局部点图与相对位姿监督</text>
  <text x="50" y="98" class="subtitle">每帧在自己的相机系描述几何；相机关系由逐帧位姿之间的成对约束学习。</text>

  <!-- Local point maps -->
  <rect x="40" y="135" width="430" height="480" rx="20" class="panel"/>
  <rect x="40" y="135" width="10" height="480" rx="5" fill="#2563eb"/>
  <text x="72" y="180" class="heading" fill="#1d4ed8">① 点图：各自在相机局部系</text>
  <text x="74" y="211" class="small">Pointmap Head 对每帧分别预测局部 XYZ</text>

  <rect x="76" y="245" width="155" height="56" rx="12" class="gray"/>
  <text x="153" y="280" text-anchor="middle" class="label">图像 Iᵢ</text>
  <path d="M231 273 H272" class="blue-line"/>
  <rect x="282" y="245" width="150" height="56" rx="12" class="blue"/>
  <text x="357" y="280" text-anchor="middle" class="label">Pᵢ 在 Cᵢ 系</text>

  <rect x="76" y="335" width="155" height="56" rx="12" class="gray"/>
  <text x="153" y="370" text-anchor="middle" class="label">图像 Iⱼ</text>
  <path d="M231 363 H272" class="blue-line"/>
  <rect x="282" y="335" width="150" height="56" rx="12" class="blue"/>
  <text x="357" y="370" text-anchor="middle" class="label">Pⱼ 在 Cⱼ 系</text>

  <!-- Local coordinate sketches -->
  <g transform="translate(112 475)">
    <circle cx="0" cy="0" r="8" fill="#1d4ed8"/>
    <path d="M0 0 H82 M0 0 V-72 M0 0 L-43 39" fill="none" stroke="#475569" stroke-width="3"/>
    <text x="88" y="7" class="small">xᵢ</text><text x="-8" y="-82" class="small">yᵢ</text><text x="-62" y="51" class="small">zᵢ</text>
  </g>
  <g transform="translate(328 475)">
    <circle cx="0" cy="0" r="8" fill="#1d4ed8"/>
    <path d="M0 0 H82 M0 0 V-72 M0 0 L-43 39" fill="none" stroke="#475569" stroke-width="3"/>
    <text x="88" y="7" class="small">xⱼ</text><text x="-8" y="-82" class="small">yⱼ</text><text x="-62" y="51" class="small">zⱼ</text>
  </g>
  <text x="255" y="530" text-anchor="middle" class="small">每帧有自己的坐标轴</text>
  <rect x="72" y="557" width="366" height="40" rx="10" fill="#eff6ff"/>
  <text x="255" y="583" text-anchor="middle" class="small" fill="#1d4ed8">点图监督：局部几何 Pᵢ / Pⱼ</text>

  <!-- Tokens and pose prediction -->
  <rect x="505" y="135" width="430" height="480" rx="20" class="panel"/>
  <rect x="505" y="135" width="10" height="480" rx="5" fill="#f59e0b"/>
  <text x="537" y="180" class="heading" fill="#b45309">② Camera Token：逐帧估计位姿</text>
  <text x="539" y="211" class="small">Token 代表当前帧；不指定特殊参考相机</text>

  <rect x="550" y="248" width="166" height="65" rx="13" class="orange"/>
  <text x="633" y="276" text-anchor="middle" class="label">当前 Camera</text>
  <text x="633" y="300" text-anchor="middle" class="body">Token gᵢ, gⱼ</text>
  <rect x="550" y="348" width="166" height="65" rx="13" class="orange"/>
  <text x="633" y="376" text-anchor="middle" class="label">历史 Token Pool</text>
  <text x="633" y="400" text-anchor="middle" class="body">全部历史相机线索</text>

  <path d="M716 280 H758 V318 H779" class="orange-line"/>
  <path d="M716 380 H755 V345 H779" class="orange-line"/>
  <rect x="779" y="291" width="127" height="86" rx="15" fill="#ffedd5" stroke="#fb923c" stroke-width="2.5"/>
  <text x="842" y="327" text-anchor="middle" class="label">Camera</text>
  <text x="842" y="355" text-anchor="middle" class="label">Head</text>

  <path d="M842 377 V444" class="orange-line"/>
  <rect x="576" y="449" width="330" height="78" rx="14" class="gray"/>
  <text x="741" y="480" text-anchor="middle" class="label">逐帧相机位姿 ĉᵢ、ĉⱼ</text>
  <text x="741" y="508" text-anchor="middle" class="small">位姿处于模型预测的共同坐标规范中</text>
  <rect x="576" y="548" width="330" height="48" rx="11" fill="#fff7ed"/>
  <text x="741" y="579" text-anchor="middle" class="small" fill="#b45309">Camera Token ≠ Reference Camera Token</text>

  <!-- Pairwise supervision -->
  <rect x="970" y="135" width="430" height="480" rx="20" class="panel"/>
  <rect x="970" y="135" width="10" height="480" rx="5" fill="#10b981"/>
  <text x="1002" y="180" class="heading" fill="#047857">③ 训练：比较帧对的相对位姿</text>
  <text x="1004" y="211" class="small">从逐帧位姿构造相对旋转与平移</text>

  <rect x="1008" y="250" width="156" height="68" rx="13" class="green"/>
  <text x="1086" y="280" text-anchor="middle" class="label">预测相对位姿</text>
  <text x="1086" y="305" text-anchor="middle" class="body">ĉᵢⱼ = f(ĉᵢ, ĉⱼ)</text>
  <rect x="1179" y="250" width="184" height="68" rx="13" class="gray"/>
  <text x="1271" y="280" text-anchor="middle" class="label">真实相对位姿</text>
  <text x="1271" y="305" text-anchor="middle" class="body">cᵢⱼ from GT</text>
  <path d="M1086 318 V357 H1155" class="green-line"/>
  <path d="M1271 318 V357 H1208" class="gray-line"/>
  <rect x="1121" y="352" width="122" height="64" rx="13" fill="#ecfdf5" stroke="#34d399" stroke-width="2.5"/>
  <text x="1182" y="392" text-anchor="middle" class="label">L camera</text>

  <rect x="1008" y="451" width="355" height="65" rx="13" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="1185" y="479" text-anchor="middle" class="label">所有帧对 i ≠ j</text>
  <text x="1185" y="503" text-anchor="middle" class="small">监督关系，不监督固定首帧绝对位姿</text>
  <rect x="1008" y="536" width="355" height="60" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1185" y="562" text-anchor="middle" class="small">全局坐标规范仍可整体改变</text>
  <text x="1185" y="585" text-anchor="middle" class="small">成对关系保持不变（Gauge Freedom）</text>

  <!-- Summary band -->
  <rect x="40" y="650" width="1360" height="160" rx="20" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
  <text x="76" y="696" class="heading" fill="#4338ca">怎么理解它与 SLAM 的距离？</text>
  <text x="78" y="738" class="body">局部几何和相机位姿分别受监督；论文没有另列跨帧同一地标的显式一致性项。</text>
  <text x="78" y="774" class="body">历史 Camera Token Pool 提供上下文，但没有显式地标、回环边或位姿图优化后的 Token 回写机制。</text>
</svg>

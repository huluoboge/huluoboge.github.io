<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
  <rect width="960" height="560" fill="#fbfcfe"/>
  
  <style>
    text { font-family: 'Noto Sans CJK SC', 'Source Han Sans SC', 'PingFang SC', Arial, sans-serif; }
    .title { font-size: 15px; font-weight: 700; fill: #1f2937; }
    .lbl { font-size: 13px; font-weight: 600; fill: #374151; }
    .small { font-size: 12px; font-weight: 500; fill: #4b5563; }
    .math { font-size: 13px; font-weight: 600; fill: #1f2937;
            font-family: 'Times New Roman', 'Noto Serif', serif; }
    .axis { stroke: #9ca3af; stroke-width: 1.2; fill: none; }
    .grid { stroke: #e5e7eb; stroke-width: 1; fill: none; }
  </style>

  <text class="title" x="480.0" y="32" text-anchor="middle">几何动画：两个 box 滑动重叠 → 三角形核 B₁(x)</text>

  <!-- ===== Top panel ===== -->
  <text class="lbl" x="80" y="58">上图：被积函数 b(τ)·b(x−τ)（重叠区面积 = 卷积值）</text>
  <line class="axis" x1="80" y1="230" x2="780" y2="230"/>
  <line class="axis" x1="80" y1="70" x2="80" y2="230"/>
  <text class="small" x="788" y="234">τ</text>
  <line x1="101.9" y1="230" x2="101.9" y2="236" stroke="#6b7280"/><text class="small" x="101.9" y="252" text-anchor="middle">-1.5</text><line x1="211.3" y1="230" x2="211.3" y2="236" stroke="#6b7280"/><text class="small" x="211.3" y="252" text-anchor="middle">-1</text><line x1="320.6" y1="230" x2="320.6" y2="236" stroke="#6b7280"/><text class="small" x="320.6" y="252" text-anchor="middle">-0.5</text><line x1="430.0" y1="230" x2="430.0" y2="236" stroke="#6b7280"/><text class="small" x="430.0" y="252" text-anchor="middle">0</text><line x1="539.4" y1="230" x2="539.4" y2="236" stroke="#6b7280"/><text class="small" x="539.4" y="252" text-anchor="middle">0.5</text><line x1="648.8" y1="230" x2="648.8" y2="236" stroke="#6b7280"/><text class="small" x="648.8" y="252" text-anchor="middle">1</text><line x1="758.1" y1="230" x2="758.1" y2="236" stroke="#6b7280"/><text class="small" x="758.1" y="252" text-anchor="middle">1.5</text>

  <!-- fixed box b(τ) -->
  <rect x="320.62" y="90" width="218.75" height="140"
        fill="#93c5fd" fill-opacity="0.55" stroke="#2563eb" stroke-width="1.6"/>
  <text class="math" x="430.0" y="82" text-anchor="middle" fill="#1d4ed8">b(τ)</text>

  <!-- moving box b(x-τ) -->
  <rect x="69.06" y="90" width="218.75" height="140"
        fill="#fdba74" fill-opacity="0.45" stroke="#c2410c" stroke-width="1.6">
    <animate attributeName="x" values="69.06;79.54;90.03;100.51;110.99;121.47;131.95;142.43;152.92;163.40;173.88;184.36;194.84;205.33;215.81;226.29;236.77;247.25;257.73;268.22;278.70;289.18;299.66;310.14;320.62;331.11;341.59;352.07;362.55;373.03;383.52;394.00;404.48;414.96;425.44;435.92;446.41;456.89;467.37;477.85;488.33;498.82;509.30;519.78;530.26;540.74;551.22;561.71;572.19" dur="10s"
             repeatCount="indefinite" calcMode="linear"/>
  </rect>
  <text class="math" x="760" y="82" text-anchor="end" fill="#9a3412">b(x−τ) 滑动</text>

  <!-- overlap = product = area -->
  <rect x="430.00" y="90" width="0" height="140"
        fill="#22c55e" fill-opacity="0.55" stroke="#15803d" stroke-width="1.4">
    <animate attributeName="x" values="430.00;430.00;430.00;430.00;320.62;320.62;320.62;320.62;320.62;320.62;320.62;320.62;320.62;320.62;320.62;320.62;320.62;320.62;320.62;320.62;320.62;320.62;320.62;320.62;320.62;331.11;341.59;352.07;362.55;373.03;383.52;394.00;404.48;414.96;425.44;435.92;446.41;456.89;467.37;477.85;488.33;498.82;509.30;519.78;530.26;430.00;430.00;430.00;430.00" dur="10s"
             repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="width" values="0;0;0;0;9.11;19.60;30.08;40.56;51.04;61.52;72.01;82.49;92.97;103.45;113.93;124.41;134.90;145.38;155.86;166.34;176.82;187.30;197.79;208.27;218.75;208.27;197.79;187.30;176.82;166.34;155.86;145.38;134.90;124.41;113.93;103.45;92.97;82.49;72.01;61.52;51.04;40.56;30.08;19.60;9.11;0;0;0;0" dur="10s"
             repeatCount="indefinite" calcMode="linear"/>
  </rect>
  <text class="small" x="430.0" y="278" text-anchor="middle">
    绿色 = 两矩形重叠；高度为 1，故重叠长度 = ∫ b(τ)b(x−τ) dτ = B₁(x)
  </text>

  <!-- legend -->
  <rect x="820" y="80" width="18" height="14" fill="#93c5fd" stroke="#2563eb"/>
  <text class="small" x="844" y="92">固定 box</text>
  <rect x="820" y="110" width="18" height="14" fill="#fdba74" stroke="#c2410c"/>
  <text class="small" x="844" y="122">滑动 box</text>
  <rect x="820" y="140" width="18" height="14" fill="#22c55e" stroke="#15803d"/>
  <text class="small" x="844" y="152">重叠面积</text>

  <!-- ===== Bottom panel ===== -->
  <text class="lbl" x="80" y="300">下图：相对位移 x 扫描时，重叠面积描出 B₁(x)=1−|x|</text>
  <line class="axis" x1="80" y1="480" x2="780" y2="480"/>
  <line class="axis" x1="80" y1="320" x2="80" y2="480"/>
  <text class="small" x="788" y="484">x</text>
  <text class="small" x="70" y="332" text-anchor="end">B₁</text>
  <line x1="138.3" y1="480" x2="138.3" y2="486" stroke="#6b7280"/><text class="small" x="138.3" y="502" text-anchor="middle">-1</text><line x1="284.2" y1="480" x2="284.2" y2="486" stroke="#6b7280"/><text class="small" x="284.2" y="502" text-anchor="middle">-0.5</text><line x1="430.0" y1="480" x2="430.0" y2="486" stroke="#6b7280"/><text class="small" x="430.0" y="502" text-anchor="middle">0</text><line x1="575.8" y1="480" x2="575.8" y2="486" stroke="#6b7280"/><text class="small" x="575.8" y="502" text-anchor="middle">0.5</text><line x1="721.7" y1="480" x2="721.7" y2="486" stroke="#6b7280"/><text class="small" x="721.7" y="502" text-anchor="middle">1</text>


  <!-- vertical guide at current x -->
  <line x1="94.58" y1="320" x2="94.58" y2="480"
        stroke="#0f766e" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.7">
    <animate attributeName="x1" values="94.58;108.56;122.53;136.51;150.49;164.46;178.44;192.41;206.39;220.36;234.34;248.32;262.29;276.27;290.24;304.22;318.19;332.17;346.15;360.12;374.10;388.07;402.05;416.02;430.00;443.98;457.95;471.93;485.90;499.88;513.85;527.83;541.81;555.78;569.76;583.73;597.71;611.68;625.66;639.64;653.61;667.59;681.56;695.54;709.51;723.49;737.47;751.44;765.42" dur="10s"
             repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="x2" values="94.58;108.56;122.53;136.51;150.49;164.46;178.44;192.41;206.39;220.36;234.34;248.32;262.29;276.27;290.24;304.22;318.19;332.17;346.15;360.12;374.10;388.07;402.05;416.02;430.00;443.98;457.95;471.93;485.90;499.88;513.85;527.83;541.81;555.78;569.76;583.73;597.71;611.68;625.66;639.64;653.61;667.59;681.56;695.54;709.51;723.49;737.47;751.44;765.42" dur="10s"

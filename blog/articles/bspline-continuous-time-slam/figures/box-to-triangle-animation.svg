  </line>

  <!-- tracer -->
  <circle cx="94.58" cy="480.00" r="7" fill="#0f766e" stroke="#fff" stroke-width="2">
    <animate attributeName="cx" values="94.58;108.56;122.53;136.51;150.49;164.46;178.44;192.41;206.39;220.36;234.34;248.32;262.29;276.27;290.24;304.22;318.19;332.17;346.15;360.12;374.10;388.07;402.05;416.02;430.00;443.98;457.95;471.93;485.90;499.88;513.85;527.83;541.81;555.78;569.76;583.73;597.71;611.68;625.66;639.64;653.61;667.59;681.56;695.54;709.51;723.49;737.47;751.44;765.42" dur="10s"
             repeatCount="indefinite" calcMode="linear"/>
    <animate attributeName="cy" values="480.00;480.00;480.00;480.00;474.33;467.82;461.30;454.78;448.27;441.75;435.23;428.72;422.20;415.68;409.17;402.65;396.13;389.62;383.10;376.58;370.07;363.55;357.03;350.52;344.00;350.52;357.03;363.55;370.07;376.58;383.10;389.62;396.13;402.65;409.17;415.68;422.20;428.72;435.23;441.75;448.27;454.78;461.30;467.82;474.33;480.00;480.00;480.00;480.00" dur="10s"

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
  <title id="title">DPV-SLAM 单向长程因子与特征缓存</title>
  <desc id="desc">旧帧只保留 patch 特征，新帧保留稠密特征图。由旧 patch 指向新帧的重投影因子仍约束旧新相机位姿和旧 patch 逆深度。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#486581"/>
    </marker>
    <style>
      .frame { fill:#f2f7fb; stroke:#486581; stroke-width:2; rx:14; }
      .patch { fill:#d7e9f8; stroke:#3c78a8; stroke-width:2; rx:7; }
      .dense { fill:#dff1e5; stroke:#43855c; stroke-width:2; rx:7; }
      .factor { fill:none; stroke:#9b6c24; stroke-width:3; marker-end:url(#arrow); }
      .constraint { fill:none; stroke:#9b6c24; stroke-width:2; stroke-dasharray:7 6; }
      .pose { fill:#fff5dc; stroke:#9b6c24; stroke-width:2; }
      .txt { font-family:'Noto Sans CJK SC', sans-serif; fill:#243b53; text-anchor:middle; }
      .head { font-size:20px; font-weight:700; }
      .body { font-size:16px; }
      .small { font-size:14px; fill:#52677d; }
    </style>
  </defs>
  <rect x="60" y="55" width="330" height="210" class="frame"/>
  <text x="225" y="88" class="txt head">旧帧 i（历史缓存）</text>
  <rect x="105" y="118" width="110" height="74" class="patch"/>
  <rect x="230" y="118" width="110" height="74" class="patch"/>
  <text x="160" y="151" class="txt body">patch 特征</text>
  <text x="285" y="151" class="txt body">patch 特征</text>
  <text x="225" y="225" class="txt small">只保存选中区域的特征</text>
  <circle cx="225" cy="316" r="25" class="pose"/>
  <text x="225" y="322" class="txt body">位姿 i</text>

  <rect x="610" y="55" width="330" height="210" class="frame"/>
  <text x="775" y="88" class="txt head">近期帧 j（前端缓存）</text>
  <rect x="670" y="118" width="210" height="74" class="dense"/>
  <text x="775" y="151" class="txt body">稠密特征图</text>
  <text x="775" y="225" class="txt small">供当前帧相关性查询使用</text>
  <circle cx="775" cy="316" r="25" class="pose"/>
  <text x="775" y="322" class="txt body">位姿 j</text>

  <path d="M340 145 C450 120 545 120 665 145" class="factor"/>
  <text x="500" y="105" class="txt body">单向 patch–帧边</text>
  <text x="500" y="169" class="txt small">重投影残差 + 源 patch 逆深度</text>
  <path d="M225 193 L225 284" class="constraint"/>
  <path d="M775 193 L775 284" class="constraint"/>
  <path d="M250 316 C380 360 620 360 750 316" class="constraint"/>
  <text x="500" y="366" class="txt small">同一 BA 因子联合约束两端位姿；旧帧无需保存整张稠密特征图</text>
</svg>

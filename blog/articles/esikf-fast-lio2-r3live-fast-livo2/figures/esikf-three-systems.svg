<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="780" viewBox="0 0 1300 780" role="img" aria-labelledby="title desc">
  <title id="title">FAST-LIO2、R3LIVE 与 FAST-LIVO2 的 ESIKF 信息流</title>
  <desc id="desc">图示三类系统中 IMU 传播、外部观测残差、迭代误差状态更新和地图反馈的共同结构。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#44546A"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, 'Noto Sans CJK SC', sans-serif; fill: #1F2933; }
      .subtitle { font: 16px Arial, 'Noto Sans CJK SC', sans-serif; fill: #52616B; }
      .box-title { font: 700 18px Arial, 'Noto Sans CJK SC', sans-serif; fill: #1F2933; }
      .box-text { font: 15px Arial, 'Noto Sans CJK SC', sans-serif; fill: #334E68; }
      .arrow-label { font: 14px Arial, 'Noto Sans CJK SC', sans-serif; fill: #52616B; }
      .note { font: 15px Arial, 'Noto Sans CJK SC', sans-serif; fill: #334E68; }
    </style>
  </defs>
  <rect width="1300" height="780" fill="#FFFFFF"/>
  <text x="650" y="46" text-anchor="middle" class="title">同一个 ESIKF 主干，三种外部观测组织</text>
  <text x="650" y="76" text-anchor="middle" class="subtitle">IMU 负责传播；LiDAR 和视觉负责构造当前观测残差；地图在更新后继续反馈</text>

  <rect x="70" y="150" width="190" height="96" rx="8" fill="#FFF7E8" stroke="#C47A2C" stroke-width="2"/>
<text x="165.0" y="177" text-anchor="middle" class="box-title">高频 IMU</text>
<text x="165.0" y="206" text-anchor="middle" class="box-text">角速度</text>
<text x="165.0" y="228" text-anchor="middle" class="box-text">比力</text>
<text x="165.0" y="250" text-anchor="middle" class="box-text">时间戳</text>
  <rect x="325" y="137" width="220" height="122" rx="8" fill="#FFF3E0" stroke="#C47A2C" stroke-width="2"/>
<text x="435.0" y="164" text-anchor="middle" class="box-title">状态传播</text>
<text x="435.0" y="193" text-anchor="middle" class="box-text">名义状态</text>
<text x="435.0" y="215" text-anchor="middle" class="box-text">协方差</text>
<text x="435.0" y="237" text-anchor="middle" class="box-text">运动补偿初值</text>
  <rect x="620" y="137" width="230" height="122" rx="8" fill="#EEF6FF" stroke="#4B83C4" stroke-width="2"/>
<text x="735.0" y="164" text-anchor="middle" class="box-title">ESIKF 更新</text>
<text x="735.0" y="193" text-anchor="middle" class="box-text">残差与 H</text>
<text x="735.0" y="215" text-anchor="middle" class="box-text">多轮误差注入</text>
<text x="735.0" y="237" text-anchor="middle" class="box-text">输出后验状态</text>
  <rect x="940" y="137" width="235" height="122" rx="8" fill="#F2F8F2" stroke="#4C9B58" stroke-width="2"/>
<text x="1057.5" y="164" text-anchor="middle" class="box-title">地图反馈</text>
<text x="1057.5" y="193" text-anchor="middle" class="box-text">更新局部地图</text>
<text x="1057.5" y="215" text-anchor="middle" class="box-text">维护颜色或视觉信息</text>
<text x="1057.5" y="237" text-anchor="middle" class="box-text">提供下一帧查询</text>

  <path d="M 260 198 L 325 198" fill="none" stroke="#44546A" stroke-width="2.1" marker-end="url(#arrow)"/>
<text x="292.5" y="187.0" text-anchor="middle" class="arrow-label">预测</text>
  <path d="M 545 198 L 620 198" fill="none" stroke="#44546A" stroke-width="2.1" marker-end="url(#arrow)"/>
<text x="582.5" y="187.0" text-anchor="middle" class="arrow-label">先验</text>
  <path d="M 850 198 L 940 198" fill="none" stroke="#44546A" stroke-width="2.1" marker-end="url(#arrow)"/>
<text x="895.0" y="187.0" text-anchor="middle" class="arrow-label">后验</text>
  <path d="M 1040 259 C 995 330, 790 340, 735 259" fill="none" stroke="#4C9B58" stroke-width="2.1" marker-end="url(#arrow)"/>
  <text x="905" y="340" text-anchor="middle" class="arrow-label">地图参与下一轮残差</text>

  <rect x="95" y="430" width="220" height="92" rx="8" fill="#F7FCF7" stroke="#4C9B58" stroke-width="2"/>
<text x="205.0" y="457" text-anchor="middle" class="box-title">FAST-LIO2</text>
<text x="205.0" y="486" text-anchor="middle" class="box-text">LiDAR 点到地图几何</text>
<text x="205.0" y="508" text-anchor="middle" class="box-text">直接扫描到地图更新</text>
  <rect x="390" y="430" width="220" height="92" rx="8" fill="#F7F3FF" stroke="#7D68B3" stroke-width="2"/>
<text x="500.0" y="457" text-anchor="middle" class="box-title">R3LIVE</text>
<text x="500.0" y="486" text-anchor="middle" class="box-text">LiDAR 几何估计</text>
<text x="500.0" y="508" text-anchor="middle" class="box-text">视觉颜色与纹理更新</text>
  <rect x="685" y="430" width="230" height="92" rx="8" fill="#F7FAFF" stroke="#4B83C4" stroke-width="2"/>
<text x="800.0" y="457" text-anchor="middle" class="box-title">FAST-LIVO2</text>
<text x="800.0" y="486" text-anchor="middle" class="box-text">LiDAR 几何约束</text>
<text x="800.0" y="508" text-anchor="middle" class="box-text">视觉直接约束</text>
  <rect x="990" y="420" width="220" height="112" rx="8" fill="#F5F7FA" stroke="#8795A1" stroke-width="2"/>
<text x="1100.0" y="447" text-anchor="middle" class="box-title">公共读法</text>
<text x="1100.0" y="476" text-anchor="middle" class="box-text">传感器进来</text>
<text x="1100.0" y="498" text-anchor="middle" class="box-text">残差进入 Hδx</text>
<text x="1100.0" y="520" text-anchor="middle" class="box-text">状态回到地图</text>

  <path d="M 205 430 L 635 259" fill="none" stroke="#44546A" stroke-width="2.1" marker-end="url(#arrow)"/>
<text x="420.0" y="333.5" text-anchor="middle" class="arrow-label">LiDAR 残差</text>
  <path d="M 500 430 L 710 259" fill="none" stroke="#44546A" stroke-width="2.1" marker-end="url(#arrow)"/>
<text x="605.0" y="333.5" text-anchor="middle" class="arrow-label">几何 + 颜色</text>
  <path d="M 800 430 L 775 259" fill="none" stroke="#44546A" stroke-width="2.1" marker-end="url(#arrow)"/>
<text x="787.5" y="333.5" text-anchor="middle" class="arrow-label">几何 + 视觉</text>
  <path d="M 990 476 L 850 236" fill="none" stroke="#44546A" stroke-width="2.1" marker-end="url(#arrow)"/>
<text x="920.0" y="345.0" text-anchor="middle" class="arrow-label">统一估计骨架</text>

  <rect x="80" y="625" width="1095" height="86" rx="8" fill="#F8FAFC" stroke="#D9E2EC" stroke-width="1.5"/>
  <text x="108" y="657" class="note">阅读顺序可以保持一致：先找 IMU 传播，再找当前观测残差，随后看误差状态迭代，最后追踪地图反馈。</text>
  <text x="108" y="687" class="note">三类系统的主要差异在外部观测和地图表达；公共主干是传播、线性化、求解、注入和反馈。</text>
</svg>

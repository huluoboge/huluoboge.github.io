<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="300" viewBox="0 0 1180 300" role="img" aria-label="SuperGlue 从局部特征到部分匹配的信息流">
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 Z" fill="#476581"/>
  </marker>
</defs>
<style>
  text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #18334d; }
  .title { font-size: 19px; font-weight: 700; }
  .detail { font-size: 15px; }
  .small { font-size: 15px; fill: #3e5970; }
  .arrow { stroke: #476581; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
</style>
<rect x="0" y="0" width="1180" height="300" fill="#f8fbfd"/>

    <rect x="25" y="94" width="155" height="90" rx="16"
          fill="#e4eff8" stroke="#35516b" stroke-width="1.5"/>
    <text x="102.5" y="128" class="title" text-anchor="middle">两组局部特征</text>
    <text x="102.5" y="155" class="detail" text-anchor="middle">坐标、置信度、描述符</text>
    

    <rect x="220" y="94" width="130" height="90" rx="16"
          fill="#e4eff8" stroke="#35516b" stroke-width="1.5"/>
    <text x="285.0" y="128" class="title" text-anchor="middle">关键点编码</text>
    <text x="285.0" y="155" class="detail" text-anchor="middle">外观 + 位置</text>
    

    <rect x="390" y="94" width="195" height="90" rx="16"
          fill="#d9eee8" stroke="#35516b" stroke-width="1.5"/>
    <text x="487.5" y="128" class="title" text-anchor="middle">注意力图网络</text>
    <text x="487.5" y="155" class="detail" text-anchor="middle">图内 / 图间交替</text>
    

    <rect x="625" y="94" width="125" height="90" rx="16"
          fill="#d9eee8" stroke="#35516b" stroke-width="1.5"/>
    <text x="687.5" y="128" class="title" text-anchor="middle">两两评分</text>
    <text x="687.5" y="155" class="detail" text-anchor="middle">描述符内积</text>
    

    <rect x="790" y="94" width="175" height="90" rx="16"
          fill="#f9e8d4" stroke="#35516b" stroke-width="1.5"/>
    <text x="877.5" y="128" class="title" text-anchor="middle">最优匹配层</text>
    <text x="877.5" y="155" class="detail" text-anchor="middle">dustbin + Sinkhorn</text>
    

    <rect x="1005" y="94" width="150" height="90" rx="16"
          fill="#f9e8d4" stroke="#35516b" stroke-width="1.5"/>
    <text x="1080.0" y="128" class="title" text-anchor="middle">部分分配</text>
    <text x="1080.0" y="155" class="detail" text-anchor="middle">对应 / 无匹配</text>
    
<path class="arrow" d="M185 139 H214"/>
<path class="arrow" d="M355 139 H384"/>
<path class="arrow" d="M590 139 H619"/>
<path class="arrow" d="M755 139 H784"/>
<path class="arrow" d="M970 139 H999"/>
<text x="490" y="224" class="small" text-anchor="middle">学习候选点对的分数：利用两幅图的上下文</text>
<path d="M390 199 H585" stroke="#4a9682" stroke-width="2"/>
<text x="875" y="224" class="small" text-anchor="middle">约束整张匹配表：一对一，允许拒配</text>
<path d="M790 199 H965" stroke="#d4924c" stroke-width="2"/>
</svg>

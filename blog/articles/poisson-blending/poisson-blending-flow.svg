<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M2,2 L10,6 L2,10 z" fill="#6b7280"/>
  </marker>
</defs>
<rect x="0" y="0" width="1180" height="720" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/>
<text x="590.0" y="42" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" fill="#20344d" font-weight="800">Poisson 融合的信息流</text>
<text x="590.0" y="74" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#6b7280" font-weight="500">源图提供引导梯度，目标图提供边界亮度，求解 Poisson 方程得到融合结果</text>
<rect x="60" y="130" width="220" height="100" rx="14" fill="#ffe6d7" stroke="#dd8452" stroke-width="2"/>
<text x="170" y="172" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#20344d" font-weight="800">源图 g</text>
<text x="170" y="202" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#6b7280" font-weight="500">待贴入内容</text>
<rect x="60" y="280" width="220" height="100" rx="14" fill="#d9e9ff" stroke="#4e8dd8" stroke-width="2"/>
<text x="170" y="322" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#20344d" font-weight="800">目标图 f*</text>
<text x="170" y="352" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#6b7280" font-weight="500">背景与边界</text>
<rect x="60" y="430" width="220" height="100" rx="14" fill="#e9edf3" stroke="#8a8f98" stroke-width="2"/>
<text x="170" y="472" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" fill="#20344d" font-weight="800">区域 Ω / mask</text>
<text x="170" y="502" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#6b7280" font-weight="500">内部待求解像素</text>
<rect x="380" y="130" width="260" height="100" rx="14" fill="#fff4e8" stroke="#dd8452" stroke-width="2"/>
<text x="510" y="172" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" fill="#20344d" font-weight="800">引导场 v = ∇g</text>
<text x="510" y="202" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#6b7280" font-weight="500">或混合梯度等变体</text>
<rect x="380" y="280" width="260" height="100" rx="14" fill="#e8f0ff" stroke="#4e8dd8" stroke-width="2"/>
<text x="510" y="322" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" fill="#20344d" font-weight="800">边界条件</text>
<text x="510" y="352" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#6b7280" font-weight="500">∂Ω 上 f = f*</text>
<rect x="380" y="430" width="260" height="100" rx="14" fill="#eef2f7" stroke="#7b8794" stroke-width="2"/>
<text x="510" y="472" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" fill="#20344d" font-weight="800">构造右端项</text>
<text x="510" y="502" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#6b7280" font-weight="500">div v = Δg</text>
<rect x="740" y="240" width="360" height="180" rx="16" fill="#e8f6ec" stroke="#55a868" stroke-width="2.5"/>
<text x="920" y="290" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#20344d" font-weight="800">求解 Poisson 方程</text>
<text x="920" y="330" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" fill="#2f3640" font-weight="600">Δf = div v    在 Ω 内</text>
<text x="920" y="365" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" fill="#2f3640" font-weight="600">f|∂Ω = f*</text>
<text x="920" y="400" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#6b7280" font-weight="500">得到稀疏线性系统</text>
<rect x="800" y="500" width="240" height="100" rx="14" fill="#d9e9ff" stroke="#4e8dd8" stroke-width="2"/>
<text x="920" y="542" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#20344d" font-weight="800">融合结果 f</text>
<text x="920" y="572" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#6b7280" font-weight="500">边界贴合、内部保结构</text>
<line x1="280" y1="180" x2="370" y2="180" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="280" y1="330" x2="370" y2="330" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="280" y1="480" x2="370" y2="480" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="640" y1="180" x2="740" y2="290" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="640" y1="330" x2="740" y2="330" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="640" y1="480" x2="740" y2="370" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="920" y1="420" x2="920" y2="500" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
</svg>

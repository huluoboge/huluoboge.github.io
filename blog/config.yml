# 博客配置（部署在 huluoboge.top/blog/ 子目录）
site:
  title: "胡洋的博客"
  description: "三维重建、SfM/MVS、SLAM、点云与工程实践"
  author: "胡洋"

# 部署前缀：站点位于域名子目录 /blog/
basePath: "/blog"

# 外部页面模板：渲染器只提供内容，页面外壳（侧栏/导航/styles.css）由主页模板决定
templateFile: template.html

# 博客首页即完整文章列表（all-articles-placeholder），单一入口
navigation:
  - name: "博客"
    path: "/"
    folder: "home"
    isHome: true
    type: "page"

homepage:
  latest_articles_count: 5
  show_projects: false
  show_blog_posts: false

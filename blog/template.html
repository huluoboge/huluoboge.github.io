<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} — Hu Yang</title>
  <link rel="stylesheet" href="/blog/static/css/katex.min.css?v=0.16.47">
  <link rel="stylesheet" href="/blog/static/css/highlight.min.css?v=1">
  <script src="/blog/static/js/mermaid.min.js"></script>
  <script src="/blog/static/js/highlight.min.js"></script>
  <script>
    // file:// 直接打开时，绝对路径 /blog/... 会解析到磁盘根目录导致资源 404
    // （公式显示为原始 LaTeX 源码）。检测到 file:// 时把资源重写为相对路径。
    // 以 pathname 中 /blog/ 为站点根：之后的目录数决定回退层级。
    (function () {
      if (location.protocol !== "file:") return;
      var parts = location.pathname.split("/blog/");
      if (parts.length < 2) return; // pathname 不含 /blog/，保持原样
      var dirs = parts[1].split("/");
      var depth = dirs.length - 1; // 页面在 /blog/ 下的目录深度（index.html 不算）
      var prefix = depth > 0 ? new Array(depth + 1).join("../") : "./";
      // link：改 href 会重新加载
      document.querySelectorAll('link[href^="/"]').forEach(function (el) {
        var abs = el.getAttribute("href"); // 原始属性值（el.href 是解析后的绝对 URL）
        el.setAttribute("href", prefix + abs.replace(/^\/blog\//, ""));
      });
      // script：已失败的脚本不会重试，需要移除重建
      document.querySelectorAll('script[src^="/"]').forEach(function (el) {
        var abs = el.getAttribute("src");
        var rel = prefix + abs.replace(/^\/blog\//, "");
        var neu = document.createElement("script");
        neu.src = rel;
        el.parentNode.replaceChild(neu, el);
      });
    })();
  </script>
  <style>
    /* ===== 设计变量（与主页同语言）===== */
    :root {
      --ink: #111111;
      --text: #333333;
      --muted: #666666;
      --faint: #8a8a8a;
      --line: #d7d7d7;
      --soft: #f5f5f5;
      --blue: #004099;
      --serif: "Times New Roman", "Noto Serif CJK SC", "Source Han Serif SC", SimSun, serif;
      --sans: Arial, "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff;
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.68;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--blue); text-decoration: none; }
    a:hover { color: #001f55; text-decoration: underline; }

    /* ===== 顶部导航：一条细线，极简 ===== */
    .blog-header {
      max-width: 780px;
      margin: 0 auto;
      padding: 28px 24px 18px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--line);
    }
    .blog-header .back-home { color: var(--muted); font-size: 13px; }
    .blog-header .back-home:hover { color: var(--blue); text-decoration: none; }
    .blog-header .blog-name { color: var(--ink); font: bold 16px var(--serif); letter-spacing: .03em; }
    .blog-header .blog-name:hover { text-decoration: none; color: var(--blue); }

    /* ===== 内容区 ===== */
    .blog-main { max-width: 780px; margin: 0 auto; padding: 32px 24px 72px; }

    /* ===== 文章排版 ===== */
    .blog-content h1 { margin: 0 0 22px; color: var(--ink); font: bold 30px/1.3 var(--serif); }
    .blog-content h2 { margin: 42px 0 14px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--ink); font: bold 24px/1.3 var(--serif); }
    .blog-content h3 { margin: 30px 0 10px; color: var(--ink); font: bold 19px/1.3 var(--serif); }
    .blog-content h4 { margin: 22px 0 8px; color: var(--ink); font-size: 15px; }
    .blog-content p { margin: 0 0 14px; }
    .blog-content ul, .blog-content ol { margin: 0 0 14px; padding-left: 22px; }
    .blog-content li { margin-bottom: 4px; }
    .blog-content blockquote { margin: 0 0 22px; padding: 10px 16px; border-left: 3px solid var(--blue); background: var(--soft); color: var(--muted); }
    .blog-content hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0; }
    .blog-content img { display: block; max-width: 100%; height: auto; margin: 20px auto; border: 1px solid var(--line); background: var(--soft); }
    .blog-content table { width: 100%; margin: 16px 0 24px; border-collapse: collapse; font-size: 13px; }
    .blog-content th, .blog-content td { padding: 7px 10px; border: 1px solid var(--line); vertical-align: top; text-align: left; }
    .blog-content th { background: var(--soft); color: var(--ink); font-weight: bold; }
    .blog-content tbody tr:nth-child(even) { background: var(--soft); }
    .blog-content code { padding: 1px 5px; background: var(--soft); font-family: Consolas, "Courier New", monospace; font-size: .92em; }
    .blog-content pre { overflow-x: auto; padding: 13px 15px; background: #f7f7f7; border: 1px solid var(--line); margin: 0 0 18px; }
    .blog-content pre code { padding: 0; background: transparent; }
    .blog-content pre code.hljs { padding: 0; background: transparent; font-size: .9em; }

    /* 公式 */
    .blog-content .katex { font-size: 1.05em; }
    .blog-content .katex-display { margin: 18px 0; overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
    .blog-content .math-block { text-align: center; margin: 18px 0; overflow-x: auto; }

    /* mermaid */
    .blog-content .mermaid { background: var(--soft); padding: 14px; margin: 16px 0; border: 1px solid var(--line); overflow: auto; text-align: center; }

    /* 返回按钮（文章页顶部） */
    .blog-content .back-button { display: inline-block; margin: 0 0 22px; color: var(--muted); font-size: 12px; }
    .blog-content .back-button:hover { color: var(--blue); text-decoration: none; }

    /* markdown 嵌入 */
    .blog-content .markdown-embed { margin: 18px 0; border: 1px solid var(--line); border-left: 3px solid var(--blue); padding: 12px 16px; background: var(--soft); }

    /* ===== 文章列表（首页）===== */
    .article-list { margin-top: 8px; }
    .article-item { padding: 20px 0; border-bottom: 1px solid var(--line); }
    .article-item:first-child { border-top: 1px solid var(--ink); }
    .article-item h3 { margin: 0 0 5px; }
    .article-item h3 a { color: var(--ink); font: bold 19px/1.3 var(--serif); }
    .article-item h3 a:hover { color: var(--blue); text-decoration: none; }
    .article-meta { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    .article-item p { margin: 0; color: var(--muted); font-size: 13px; }
    .article-item-with-image { display: grid; grid-template-columns: 140px 1fr; gap: 20px; align-items: start; }
    .article-thumbnail { width: 100%; height: auto; border: 1px solid var(--line); }

    /* ===== 响应式 ===== */
    @media (max-width: 768px) {
      .blog-header, .blog-main { padding-left: 18px; padding-right: 18px; }
      .blog-content h1 { font-size: 25px; }
      .blog-content h2 { font-size: 21px; }
      .article-item-with-image { grid-template-columns: 1fr; }
      table { display: block; overflow-x: auto; white-space: nowrap; }
      .katex-display { font-size: .95em; }
    }
    @media (max-width: 480px) {
      body { font-size: 14px; }
      .katex { font-size: .95em; }
      .katex-display { font-size: .88em; }
    }
  </style>
</head>
<body>
  <header class="blog-header">
    <a class="back-home" href="/index.html">← 主页</a>
    <a class="blog-name" href="/blog/index.html">胡洋的博客</a>
  </header>

  <main class="blog-main">
    <div class="blog-content">
      {{CONTENT}}
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('pre code').forEach(function(block) {
        if (window.hljs) hljs.highlightElement(block);
      });
      if (window.mermaid && document.querySelector('.mermaid')) {
        mermaid.initialize({ startOnLoad: true });
        mermaid.run();
      }
    });
  </script>
</body>
</html>

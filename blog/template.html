  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // 代码高亮
      document.querySelectorAll('pre code').forEach(function(block) {

      });
      // Mermaid 图表
      if (window.mermaid && document.querySelector('.mermaid')) {
        mermaid.initialize({ startOnLoad: true });
        mermaid.run();
      }
    });
